appId: ${MAESTRO_APP_ID}
name: Sync lifecycle resume refresh
---
- runFlow:
    file: shared/open-sync-lifecycle.yml
- tapOn: Reset State
- assertVisible:
    text: resume-refreshes:0
- pressKey: home
- launchApp:
    stopApp: false
- assertVisible:
    text: ready
- assertVisible:
    text: resume-refreshes:1
