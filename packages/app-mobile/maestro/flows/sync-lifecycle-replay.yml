appId: ${MAESTRO_APP_ID}
name: Sync lifecycle replay after relaunch
---
- runFlow:
    file: shared/open-sync-lifecycle.yml
- tapOn: Reset State
- tapOn: Queue Replay Event
- assertVisible:
    text: queued:1
- assertVisible:
    text: applied:0
- assertVisible:
    text: replay-count:0
- stopApp: ${MAESTRO_APP_ID}
- runFlow:
    file: shared/open-sync-lifecycle.yml
- assertVisible:
    text: queued:1
- assertVisible:
    text: applied:1
- assertVisible:
    text: replay-count:1
