appId: ${MAESTRO_APP_ID}
name: Sync lifecycle sensitive auth rejection on reconnect
---
- runFlow:
    file: shared/open-sync-lifecycle.yml
- tapOn: Reset State
- assertVisible: network-online:true
- runFlow:
    file: shared/attempt-control-center-connectivity-toggle.yml
- runFlow:
    when:
      visible: network-online:true
    commands:
      - tapOn: Simulate Offline
- assertVisible: network-online:false
- tapOn: Queue Sensitive Authorized
- tapOn: Reject Sensitive Unauthorized
- assertVisible: sensitive-queued:3
- assertVisible: sensitive-applied:0
- assertVisible: sensitive-rejected:3
- assertVisible: sensitive-replay-count:0
- assertVisible: sensitive-matrix:tq1-ta0-tr1|pq1-pa0-pr1|lq1-la0-lr1
- runFlow:
    file: shared/attempt-control-center-connectivity-toggle.yml
- runFlow:
    when:
      visible: network-online:false
    commands:
      - tapOn: Simulate Online
- assertVisible: network-online:true
- assertVisible: network-refreshes:1
- assertVisible: sensitive-queued:3
- assertVisible: sensitive-applied:3
- assertVisible: sensitive-rejected:3
- assertVisible: sensitive-replay-count:1
- assertVisible: sensitive-matrix:tq1-ta1-tr1|pq1-pa1-pr1|lq1-la1-lr1
- stopApp: ${MAESTRO_APP_ID}
- runFlow:
    file: shared/open-sync-lifecycle.yml
- assertVisible: sensitive-queued:3
- assertVisible: sensitive-applied:3
- assertVisible: sensitive-rejected:3
- assertVisible: sensitive-replay-count:1
