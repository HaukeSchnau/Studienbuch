pre-commit:
  parallel: true
  jobs:
    - name: format
      run: bun run checks:fmt -- --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: lint
      run: bun run checks:lint:fix-safe -- {staged_files}
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx}"
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: lint
      run: bun run checks:lint
