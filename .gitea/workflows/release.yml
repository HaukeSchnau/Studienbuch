name: Verify and promote Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  production:
    name: Production
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Add Nix to PATH
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            echo /run/current-system/sw/bin >> "$GITHUB_PATH"
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          nix --version

      - name: Verify Project
        run: nix flake check --print-build-logs

      - name: Build immutable Release
        run: |
          set -euo pipefail
          release="$(nix build .#projectRelease --no-link --print-out-paths --print-build-logs)"
          test "$(printf '%s\n' "$release" | wc -l)" -eq 1
          printf 'RELEASE_STORE_PATH=%s\n' "$release" >> "$GITHUB_ENV"

      - name: Wait for cache publication
        run: |
          set -euo pipefail
          basename="${RELEASE_STORE_PATH#/nix/store/}"
          store_hash="${basename%%-*}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "https://cache.schnau.dev/nix/${store_hash}.narinfo" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Release was not published to cache.schnau.dev within ten minutes" >&2
          exit 1

      - name: Promote exact Release
        env:
          APP_DEPLOYMENTS_WEBHOOK_TOKEN: ${{ secrets.APP_DEPLOYMENTS_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          printf -v payload \
            '{"revision":"%s","storePath":"%s","source":"gitea-actions"}' \
            "$GITHUB_SHA" "$RELEASE_STORE_PATH"

          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error \
              --output promotion.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${APP_DEPLOYMENTS_WEBHOOK_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              http://srv-2:18100/deploy/studienbuch)"
            if [ "$status" = 202 ]; then
              cat promotion.json
              exit 0
            fi
            cat promotion.json >&2
            if [ "$status" != 503 ]; then
              if [ "$status" = 409 ]; then
                echo "Release is valid but incompatible with the current infra bindings" >&2
              else
                echo "Promotion was rejected with HTTP ${status}" >&2
              fi
              exit 1
            fi
            sleep 10
          done
          echo "Release could not be substituted and activated within five minutes" >&2
          exit 1

      - name: Verify production
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://studienbuch.schnau.dev/api/health/live \
            | grep --fixed-strings '"status":"alive"' >/dev/null
          curl --fail --silent --show-error \
            https://studienbuch.schnau.dev/api/health/ready \
            | grep --fixed-strings '"status":"ready"' >/dev/null
