name: CI

# Pull requests stop after QA. Pushes to `main` and manual runs publish only after this job succeeds,
# so the same `just qa` a developer runs is the gate in front of the immutable Release workflow.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studienbuch-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  qa:
    name: Format, lint, type-check, and test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Add Nix to PATH
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            echo /run/current-system/sw/bin >> "$GITHUB_PATH"
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          nix --version

      # `just qa` is `fmt-check`, `lint`, `mobile-e2e-check` and `test`. `lint` is where type
      # checking happens: Vite+ runs Oxlint with `typeCheck: true`, so there is deliberately no
      # separate type-check step to keep in sync with it.
      #
      # `@stu/server`'s integration test opts in through `DOCKER_HOST` and skips loudly without it.
      # The host runners expose a Podman-compatible socket, so CI runs the suite against a real
      # PostgreSQL. The Release smoke in `nix/checks.nix` independently covers migration history.
      # The host runner has a persistent pnpm content-addressable store, but a disposable checkout
      # still spent about 20 seconds cloning 1,535 packages into node_modules. Keep one ordinary
      # pnpm workspace per runner architecture instead. rsync replaces all source with the exact
      # checkout while protecting node_modules. A fingerprint of every dependency input and the
      # Node/pnpm toolchain skips pnpm only when the installed tree is known to match; changed inputs
      # still get a frozen install. The lock covers the whole operation so concurrent refs cannot
      # observe each other's tree.
      - name: Install dependencies and run QA
        run: |
          set -euo pipefail
          source_workspace="$GITHUB_WORKSPACE"
          nix develop .#ci --command bash -s -- "$source_workspace" <<'BASH'
            set -euo pipefail
            source_workspace="$1"
            cache_root="${XDG_CACHE_HOME:-$HOME/.cache}/studienbuch-ci/$(uname -m)"
            qa_workspace="$cache_root/workspace"
            install -d "$qa_workspace"
            exec 9>"$cache_root/workspace.lock"
            flock 9
            rsync -a --delete --exclude node_modules --exclude .jj \
              "$source_workspace/" "$qa_workspace/"
            cd "$qa_workspace"
            export PATH="$PWD/node_modules/.bin:$PATH"
            install_fingerprint="$(
              {
                printf 'node=%s\npnpm=%s\n' "$(node --version)" "$(pnpm --version)"
                find . \
                  \( -path './.git' -o -path './node_modules' \) -prune -o \
                  -type f \
                  \( -name package.json \
                    -o -name pnpm-lock.yaml \
                    -o -name pnpm-workspace.yaml \
                    -o -name .npmrc \
                    -o -name .pnpmfile.cjs \
                    -o -name pnpmfile.cjs \
                    -o -path './patches/*' \
                  \) -print0 \
                  | sort -z \
                  | xargs -0 sha256sum
              } | sha256sum | cut -d' ' -f1
            )"
            install_stamp="$cache_root/install-$install_fingerprint"
            if [ ! -f "$install_stamp" ] || [ ! -f node_modules/.modules.yaml ]; then
              pnpm install --frozen-lockfile
              touch "$install_stamp"
            else
              echo "Dependencies match the persistent install ($install_fingerprint)"
            fi
            just qa
          BASH

  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: qa
    uses: schnau/nix-infra-modules/.gitea/workflows/project-release.yml@main
    with:
      verification_check: projectReleaseGate
