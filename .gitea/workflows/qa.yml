name: CI

# Pull requests stop after QA. Pushes to `main` and manual runs verify the release contract in the
# same runner allocation, then publish through the immutable Release workflow.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studienbuch-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  CI_PROJECT_ID: studienbuch

jobs:
  qa:
    name: Format, lint, type-check, and test
    runs-on: studienbuch-ci
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Add Nix to PATH
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            echo /run/current-system/sw/bin >> "$GITHUB_PATH"
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          nix --version

      # The workspace runner only synchronizes files, locks the persistent workspace, and invokes
      # project hooks. `.ci/` owns dependency setup; `just qa` owns the complete task graph.
      - name: Install dependencies and run QA
        run: |
          set -euo pipefail
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just qa

      - name: Verify release contract
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix build ".#checks.${system}.projectReleaseGate" --no-link --print-build-logs

  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: qa
    uses: schnau/nix-infra-modules/.gitea/workflows/project-release.yml@main
    with:
      runner_label: studienbuch-ci
      readiness_url: https://beta.studienbuch.app/api/health/ready
