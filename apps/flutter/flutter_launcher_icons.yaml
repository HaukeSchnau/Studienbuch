flutter_launcher_icons:
  ios: true
  image_path: "assets/logo.png"
  image_path_ios: "assets/icon-square.png"
  remove_alpha_ios: true
  min_sdk_android: 21 # android min sdk min:16, default 21
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
