<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Studienbuch">
  <title>Studienbuch</title>
  <!--
    The app's own home screen, shrunk to a tile: a green cover, the white page beneath it, and the
    blue line that always trails the curve. A green cover over a white page is also, conveniently,
    what a Studienbuch is.
  -->
  <defs>
    <clipPath id="sb-mark-tile">
      <rect width="64" height="64" rx="15" ry="15" />
    </clipPath>
  </defs>
  <g clip-path="url(#sb-mark-tile)">
    <rect width="64" height="64" fill="#33A42B" />
    <path d="M0 41C14 42 26 37 40 30 49 26 57 24 64 23V64H0Z" fill="#FFFFFF" />
    <path
      d="M-6 46C10 47 26 42 41 35 50 31 59 29 70 28"
      fill="none"
      stroke="#3B7FD9"
      stroke-width="2.75"
      stroke-linecap="round"
    />
  </g>
  <!--
    The lower half of the tile is white, so on a white or near-white surface the mark would lose its
    outline and read as a floating green blob. This hairline keeps the tile a tile everywhere.
  -->
  <rect
    x="0.6"
    y="0.6"
    width="62.8"
    height="62.8"
    rx="14.4"
    ry="14.4"
    fill="none"
    stroke="#203755"
    stroke-opacity="0.12"
    stroke-width="1.2"
  />
</svg>
