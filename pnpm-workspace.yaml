packages:
  - apps/*
  - packages/*

catalogMode: strict

catalog:
  typescript: 7.0.2
  # Vite+ bundles Vite and Vitest. These two follow its release, so every package and plugin
  # resolves the same copies as `vp`.
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  # Effect's unstable modules change in patch releases, so `effect` and every `@effect/*` sit at one
  # exact version and move together.
  effect: 4.0.7
  "@effect/platform-node": 4.0.7
  "@effect/sql-pg": 4.0.7
  "@effect/vitest": 4.0.7
  "@effect/atom-react": 4.0.7
  "@effect/sql-pglite": 4.0.7
  "@effect/sql-sqlite-node": 4.0.7
  "@effect/sql-sqlite-wasm": 4.0.7
  # The wasm SQLite build behind @effect/sql-sqlite-wasm, which bundles SQLite 3.50.4.
  "@effect/wa-sqlite": 0.2.1
  "@electric-sql/pglite": 0.5.13
  # Drizzle's Effect driver exists only in the 1.0 release candidates. Its pin moves together with
  # Effect's (ADR 0012).
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  "@types/node": 26.6.5
  "@fontsource-variable/nunito": 5.3.0
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-start": 1.169.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  # React, React Native and React Native Web follow Expo SDK 58's pins, so the landing page renders
  # with the versions the app runs.
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0
  react-native-web: 0.21.4

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # @effect/sql-pglite would otherwise bring its own older PGlite.
  "@electric-sql/pglite@*": "catalog:"

peerDependencyRules:
  # The alias reports Vite+'s version, not the Vite 8 inside it.
  allowedVersions:
    vite: "*"
    # The driver's range is stale: Effect's own repository tests it against 0.2.1.
    "@effect/sql-sqlite-wasm>@effect/wa-sqlite": 0.2.1

# Same-day releases we need now. Delete each entry at the next bump of its package.
minimumReleaseAgeExclude:
  - effect@4.0.7
  - "@effect/platform-node-shared@4.0.7"
  - "@effect/platform-node@4.0.7"
  - "@effect/sql-pg@4.0.7"
  - "@effect/vitest@4.0.7"
  - "@effect/atom-react@4.0.7"
  - "@effect/sql-pglite@4.0.7"
  - "@effect/sql-sqlite-node@4.0.7"
  - "@effect/sql-sqlite-wasm@4.0.7"
  - "@electric-sql/pglite@0.5.13"
