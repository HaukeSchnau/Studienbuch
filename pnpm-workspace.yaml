packages:
  - apps/*
  - packages/*

catalogMode: strict

catalog:
  typescript: 7.0.2
  # Vite+ bundles Vite and Vitest. These two follow its release, so every package and plugin
  # resolves the same copies as `vp`.
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  # The alias reports Vite+'s version, not the Vite 8 inside it.
  allowedVersions:
    vite: "*"
