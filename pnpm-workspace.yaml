packages:
  - apps/*
  - packages/*

catalogMode: strict

catalog:
  "@effect/tsgo": 0.62.0
  # Exactly the oxlint that Vite+ bundles, which loads the local plugins in tools/oxlint.
  "@oxlint/plugins": 1.89.0
  knip: 6.43.0
  typescript: 7.0.2
  # Vite+ bundles Vite and Vitest. These two follow its release, so every package and plugin
  # resolves the same copies as `vp`.
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  # Effect's unstable modules change in patch releases, so `effect` and every `@effect/*` sit at one
  # exact version and move together.
  effect: 4.0.7
  "@effect/platform-node": 4.0.7
  "@effect/sql-pg": 4.0.7
  "@effect/vitest": 4.0.7
  "@effect/atom-react": 4.0.7
  "@effect/sql-pglite": 4.0.7
  "@effect/sql-sqlite-node": 4.0.7
  "@effect/sql-sqlite-wasm": 4.0.7
  # The wasm SQLite build behind @effect/sql-sqlite-wasm, which bundles SQLite 3.50.4.
  "@effect/wa-sqlite": 0.2.1
  "@electric-sql/pglite": 0.5.13
  # Drizzle's Effect driver exists only in the 1.0 release candidates. Its pin moves together with
  # Effect's (ADR 0012).
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  "@types/node": 26.6.5
  "@fontsource-variable/nunito": 5.3.0
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-start": 1.169.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  # The React Compiler on Oxc for the web build. Its 0.x version follows @vitejs/plugin-react's peer
  # range (`^0.152.0` in 6.1.2), so it moves when the plugin does.
  oxc-transform-react: 0.152.0
  # React, React Native and React Native Web follow Expo SDK 58's pins, so the landing page renders
  # with the versions the app runs.
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0
  react-native-web: 0.21.4
  # The Expo app. Expo 58.0.20 is the release that pins React Native 0.88.0 above; its modules sit at
  # the versions that release names in `bundledNativeModules.json`.
  expo: 58.0.20
  expo-constants: 58.0.13
  expo-font: 58.0.10
  expo-linking: 58.0.14
  expo-router: 58.0.27
  expo-secure-store: 58.0.2
  expo-splash-screen: 58.0.11
  expo-sqlite: 58.0.14
  expo-status-bar: 58.0.4
  expo-symbols: 58.0.4
  expo-system-ui: 58.0.6
  expo-updates: 58.0.18
  "@expo/metro-runtime": 58.0.15
  react-native-safe-area-context: 5.10.1
  react-native-screens: 4.30.0
  react-native-svg: 15.16.0
  # Nunito as static TTFs, which native builds embed. The web keeps the variable font from @stu/ui.
  "@expo-google-fonts/nunito": 0.4.2
  # The native crypto pair WP-2 proved on Hermes; quick-crypto was built against these two.
  react-native-quick-crypto: 1.1.9
  react-native-nitro-modules: 0.37.1
  react-native-quick-base64: 3.0.1
  # X-Wing for key boxes (D38).
  "@noble/post-quantum": 0.7.1
  # SHA-256 for the sync contract's hash, synchronous on Hermes, browsers and Node.
  "@noble/hashes": 2.4.0
  # Civil dates through its functional API, which defers to a native Temporal where one exists
  # and runs on Hermes, which has none (ADR 0001).
  temporal-polyfill: 1.0.6
  # Accounts. Better Auth and its passkey plugin move together, and the passkey patch below names
  # the exact release (ADR 0028).
  better-auth: 1.7.14
  "@better-auth/passkey": 1.7.14
  # Better Auth's own pool, beside Effect's client (stack.md). Pure JS: the bundle never loads the
  # optional pg-native addon.
  pg: 8.23.1
  "@types/pg": 8.23.1
  # SMTP for `MAIL_URL`. It ships its own types.
  nodemailer: 10.2.1
  # The network state that the engine's connection supervisor follows on iOS and Android, at the
  # version Expo 58.0.20 names in `bundledNativeModules.json`.
  expo-network: 58.0.4
  # Browser tests (`*.browser.test.ts`): Vitest's Playwright provider at Vite+'s Vitest version, and
  # the Playwright whose browsers nixpkgs builds (`playwright-driver.browsers`).
  "@vitest/browser-playwright": 5.0.5
  playwright: 1.64.1
  # Metro's Babel transformer, which apps/app/metro.transformer.js wraps, at the version Expo 58.0.20
  # depends on.
  "@expo/metro-config": 58.0.18
  # Signs a demo session's token the way Better Auth's bearer plugin does, at Better Auth's own
  # version of it.
  better-call: 1.4.4
  # Ed25519 public keys from a seed without exporting the private key. The version
  # @noble/post-quantum pins.
  "@noble/curves": 2.4.0
  # Passkeys in the app: the browser's WebAuthn through SimpleWebAuthn, and iOS and Android
  # through react-native-passkeys, the one library that maps PRF on iOS (stack.md).
  "@simplewebauthn/browser": 14.0.0
  react-native-passkeys: 0.4.2

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # @effect/sql-pglite would otherwise bring its own older PGlite.
  "@electric-sql/pglite@*": "catalog:"

peerDependencyRules:
  # The alias reports Vite+'s version, not the Vite 8 inside it.
  allowedVersions:
    vite: "*"
    # The driver's range is stale: Effect's own repository tests it against 0.2.1.
    "@effect/sql-sqlite-wasm>@effect/wa-sqlite": 0.2.1

# Same-day releases we need now. Delete each entry at the next bump of its package.
minimumReleaseAgeExclude:
  - effect@4.0.7
  - "@effect/platform-node-shared@4.0.7"
  - "@effect/platform-node@4.0.7"
  - "@effect/sql-pg@4.0.7"
  - "@effect/vitest@4.0.7"
  - "@effect/atom-react@4.0.7"
  - "@effect/sql-pglite@4.0.7"
  - "@effect/sql-sqlite-node@4.0.7"
  - "@effect/sql-sqlite-wasm@4.0.7"
  - "@electric-sql/pglite@0.5.13"
  - "@noxcturnal/noxcturnal-win32-x64-msvc@0.1.11"

patchedDependencies:
  # Passkey sign-in asks for "preferred" user verification and both verify calls accept none, but
  # the PRF unlock needs verification on every assertion (recovery.md, section 4). The patch reads
  # `authenticatorSelection.userVerification` for all three, so "required" applies everywhere.
  # `Auth.test.ts` fails when a bump drops it. Delete it once upstream PR #11155 or #11981 ships.
  "@better-auth/passkey@1.7.14": patches/@better-auth__passkey@1.7.14.patch
  # Expo Router ignores `experiments.baseUrl` while NODE_ENV is development (expo/expo#47701), so
  # behind the dev server's front door `/app/...` matched no route and links left `/app`. The patch
  # is upstream's fix, expo/expo#49236: apply the base URL in every mode, as release builds do.
  # Bumping expo-router fails `pnpm install` on this unused key; then delete the patch if the new
  # release contains #49236, or recreate it with `pnpm patch` if not.
  expo-router@58.0.27: patches/expo-router@58.0.27.patch
