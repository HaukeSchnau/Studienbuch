packages:
  - apps/*
  - packages/*
  - scripts

allowBuilds:
  "@sentry/cli": true
  core-js: false
  esbuild: true
  lightningcss: true
  msgpackr-extract: true

catalog:
  "@effect/atom-react": 4.0.0-beta.107
  "@effect/openapi-generator": 4.0.0-beta.107
  "@effect/platform-node": 4.0.0-beta.107
  "@effect/platform-node-shared": 4.0.0-beta.107
  "@effect/tsgo": 0.36.4
  "@types/node": ^26.2.0
  effect: 4.0.0-beta.107
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8

minimumReleaseAgeExclude:
  - "@better-auth/core@1.6.27"
  - "@better-auth/drizzle-adapter@1.6.27"
  - "@better-auth/kysely-adapter@1.6.27"
  - "@better-auth/memory-adapter@1.6.27"
  - "@better-auth/mongo-adapter@1.6.27"
  - "@better-auth/prisma-adapter@1.6.27"
  - "@better-auth/telemetry@1.6.27"
  - "@posthog/browser-common@0.5.0"
  - "@posthog/types@1.402.3"
  - "better-auth@1.6.27"
  - "posthog-js@1.415.5"

overrides:
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  effect: "catalog:"
  expo-constants: 57.0.10
  lightningcss: 1.30.1
  react-native-screens: 4.26.2
  vite: "catalog:"

packageExtensions:
  "vite-plus@*":
    dependencies:
      vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
